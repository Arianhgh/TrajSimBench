name: porto
version: v1
enabled: true
raw_path: data/raw/porto.csv
source_name: Taxi Service Trajectory - Prediction Challenge, ECML PKDD 2015
source_url: https://archive.ics.uci.edu/dataset/339/taxi%2Bservice%2Btrajectory%2Bprediction%2Bchallenge%2Becml%2Bpkdd%2B2015
polyline_field: POLYLINE
trip_id_field: TRIP_ID
timestamp_field: TIMESTAMP
timestamp_semantics: start_time_plus_interval
sampling_interval_s: 15
missing_data_sentinel: ""
bounding_box: [-9.3, 41.0, -8.3, 42.0]
min_points: 2
max_points: 10000
projected_crs: EPSG:32629
has_timestamps: true
split_seed: 2025
query_database_seed: 2025
retrieval_scales: [tiny, standard, medium, large]
source_license: CC BY 4.0; cite UCI DOI 10.24432/C55W25
redistribution_policy: raw input remains outside Git
